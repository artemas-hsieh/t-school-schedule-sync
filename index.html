<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f7f2">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; base-uri 'self'; form-action 'none'; frame-ancestors 'none'">
  <title>T-SCHOOL Schedule Sync</title>
  <link rel="stylesheet" href="assets/fonts/noto-sans-tc/wght.css">
  <link rel="stylesheet" href="assets/fonts/material-symbols-outlined/material-symbols.css">
  <style>
    :root {
      color-scheme: light;
      --paper: #f4f7f2;
      --ink: #14211d;
      --shift: #f05a47;
      --display: "Noto Sans TC Variable", "Noto Sans TC", sans-serif;
      --technical: "Noto Sans TC Variable", "Noto Sans TC", sans-serif;
      --space-6: 24px;
      --space-10: 40px;
      --text-caption: 0.75rem;
      --leading-caption: 16px;
      --radius-control: 4px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-width: 320px;
      min-height: 100%;
      margin: 0;
      background: var(--paper);
    }

    body {
      color: var(--ink);
      font-family: var(--display);
      text-rendering: optimizeLegibility;
    }

    .site-header {
      position: fixed;
      top: 0;
      right: 0;
      left: 0;
      z-index: 80;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 72px;
      padding: 0 32px;
      border-bottom: 1px solid rgba(20, 33, 29, 0.14);
      background: rgba(244, 247, 242, 0.96);
      backdrop-filter: blur(12px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--ink);
      text-decoration: none;
    }

    .brand-name {
      font-family: var(--technical);
      font-size: var(--text-caption);
      font-weight: 800;
      line-height: var(--leading-caption);
    }

    .stage-menu {
      position: relative;
      z-index: 1;
    }

    .stage-menu-trigger {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: var(--space-10);
      min-height: var(--space-10);
      padding: 0;
      border: 1px solid transparent;
      border-radius: var(--radius-control);
      background: transparent;
      color: var(--ink);
      font-family: var(--technical);
      font-size: var(--text-caption);
      font-weight: 800;
      line-height: var(--leading-caption);
    }

    .stage-menu-icon {
      position: relative;
      display: grid;
      width: var(--space-6);
      height: var(--space-6);
      place-items: center;
    }

    .stage-menu-icon .material-symbols-outlined {
      grid-area: 1 / 1;
      font-size: var(--space-6);
      transition: transform 180ms ease, opacity 140ms ease;
    }

    .stage-menu-icon-close {
      opacity: 0;
      transform: rotate(-90deg) scale(0.8);
    }

    .temporary-notice {
      display: grid;
      min-height: 100svh;
      padding: calc(64px + 48px) 32px 64px;
      place-items: center;
      text-align: center;
    }

    .temporary-notice h1 {
      max-width: 1000px;
      margin: 0;
      font-size: clamp(1.6rem, 2.8vw, 2rem);
      font-weight: 640;
      letter-spacing: -0.025em;
      line-height: 1.6;
    }

    .temporary-notice-accent {
      color: var(--shift);
    }

    @media (max-width: 760px) {
      .site-header {
        height: 64px;
        padding: 0 20px;
      }

      .temporary-notice {
        padding: calc(56px + 32px) 24px 40px;
      }

      .temporary-notice h1 {
        font-size: clamp(1.55rem, 6vw, 2rem);
        letter-spacing: -0.02em;
        line-height: 1.6;
      }
    }

    @media (max-width: 600px) {
      .site-header {
        height: 56px;
        padding: 0 16px;
      }
    }
  </style>
</head>
<body>
  <header class="site-header" aria-label="T-SCHOOL Schedule Sync">
    <span class="brand">
      <span class="brand-name">T-SCHOOL Schedule Sync</span>
    </span>
    <div class="stage-menu">
      <span class="stage-menu-trigger" aria-hidden="true">
        <span class="stage-menu-icon">
          <span class="material-symbols-outlined stage-menu-icon-menu">menu</span>
          <span class="material-symbols-outlined stage-menu-icon-close">close</span>
        </span>
      </span>
    </div>
  </header>

  <main>
    <section class="temporary-notice" aria-labelledby="temporary-notice-title">
      <h1 id="temporary-notice-title">
        由於 1Campus 最近將課表資料從<span class="temporary-notice-accent">公開連結改成了需要登入驗證的系統介面</span>，導致本工具無法取得最新課表<br>
        <span class="temporary-notice-accent">為避免錯誤資訊造成您排錯行程，請先以 1Campus 中的課表為準</span>
      </h1>
    </section>
  </main>
</body>
</html>
